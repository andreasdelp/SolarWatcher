<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SolarWatcher – Totale Sonnenfinsternisse</title>
    <script>
        // Hinter einem Reverse-Proxy im Unterverzeichnis: relative URLs brauchen den abschließenden Schrägstrich.
        if (!location.pathname.endsWith('/') && !location.pathname.endsWith('.html')) {
            location.replace(location.pathname + '/' + location.search + location.hash);
        }
    </script>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="lib/leaflet/leaflet.css">
    <link rel="stylesheet" href="css/site.css">
</head>
<body>
    <main id="map" aria-label="Karte"></main>

    <aside id="panel">
        <header>
            <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
                <circle cx="16" cy="16" r="13" fill="#f6c453" opacity=".25"/>
                <circle cx="16" cy="16" r="10.5" fill="#f6c453" opacity=".55"/>
                <circle cx="16" cy="16" r="8.5" fill="#0b1020"/>
            </svg>
            <div>
                <h1>SolarWatcher</h1>
                <p>Totale Sonnenfinsternisse ab 2026</p>
            </div>
        </header>

        <nav id="picker" aria-label="Finsternis auswählen">
            <button id="prev" type="button" aria-label="Vorherige Finsternis" title="Vorherige Finsternis">‹</button>
            <select id="select" aria-label="Finsternis"></select>
            <button id="next" type="button" aria-label="Nächste Finsternis" title="Nächste Finsternis">›</button>
        </nav>

        <div id="scroll">
            <section id="details" aria-live="polite">
                <p class="muted">Daten werden geladen …</p>
            </section>

            <section id="place" aria-live="polite"></section>
        </div>

        <footer>
            Finsternisdaten: Besselsche Elemente von Fred Espenak, NASA/GSFC.
            Karte: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>-Mitwirkende.
        </footer>
    </aside>

    <script src="lib/leaflet/leaflet.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
