services:
  solarwatcher:
    build: .
    image: solarwatcher:latest
    container_name: solarwatcher
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Nur setzen, wenn der Reverse-Proxy das Unterverzeichnis NICHT abschneidet (siehe README).
      # PathBase: /solarwatcher
      TZ: Europe/Berlin
